name: Sync Docker Image
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and push to ghcr.io
        run: |
          docker pull asdlokj1qpi23/subconverter:latest
          docker tag asdlokj1qpi23/subconverter:latest ghcr.io/cfymrq/subconverter:latest
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/cfymrq/subconverter:latest
